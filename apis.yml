aid: strawberry
name: Strawberry
description: 'Strawberry is an agentic web browser for macOS with AI companions that
  work inside it: you describe an outcome and a companion operates the open web on
  your behalf — logged in as you, across many tabs — to research, extract data, fill
  forms, draft messages, and run multi-step work end to end ("Do hours of work in
  minutes"). Companions are persistent AI teammates you brief once; Routines run work
  on a schedule; Skills save a workflow to re-run in one line; Integrations let companions
  act across apps you are already signed into (Gmail, Google Sheets, Notion, Slack,
  Stripe, and more). It keeps a human in control, asking approval before consequential
  actions. Distributed as a desktop app, metered in credits. Backed by EQT Ventures
  and General Catalyst. Strawberry publishes no public REST/OpenAPI developer API as
  of this profiling; its surface is the consumer app plus web documentation, a security
  program, and machine-readable llms.txt and security.txt.'
